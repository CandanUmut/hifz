    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10141A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    />
    <title>hifz — memorise the Qur’an and keep it (free, works offline)</title>
    <meta
      name="description"
      content="Free, open-source app to memorise the Qur’an word for word and keep it, with spaced review. English and Turkish. Nothing leaves your device."
    />
    <link rel="canonical" href="https://candanumut.github.io/hifz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hifz" />
    <meta property="og:title" content="hifz — memorise the Qur’an and keep it" />
    <meta
      property="og:description"
      content="Free, open-source app to memorise the Qur’an word for word and keep it, with spaced review. English and Turkish. Nothing leaves your device."
    />
    <meta property="og:url" content="https://candanumut.github.io/hifz/" />
    <meta property="og:image" content="https://candanumut.github.io/hifz/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />

    />

    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link
      rel="preload"
      href="./fonts/uthmanic-hafs-ver18.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem('hifz.theme') || 'auto'
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'auto' ? (dark ? 'gece' : 'gunduz') : saved
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
