<!doctype html>
<html lang="en" data-theme="gunduz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314181F'/%3E%3Crect x='7' y='9' width='18' height='2.4' rx='1.2' fill='%23EEF0EA'/%3E%3Crect x='7' y='15' width='12' height='2.4' rx='1.2' fill='%23EEF0EA' opacity='.45'/%3E%3Crect x='7' y='21' width='15' height='2.4' rx='1.2' fill='%23EEF0EA' opacity='.14'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Memorise text word for word and keep it memorised. Everything stays on your device."
    />
    <title>Hifz</title>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link
      rel="preload"
      href="./fonts/uthmanic-hafs-ver18.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var saved = localStorage.getItem('hifz.theme') || 'auto'
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved === 'auto' ? (dark ? 'gece' : 'gunduz') : saved
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
